<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ราฟาเอล AI</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--glow:#5ee7ff;--ink:#e6f6ff;--soft:#8fa8c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#16234a 0%,#070b1a 65%);color:var(--ink);font:16px/1.5 'Prompt',sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(94,231,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(94,231,255,.06) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
h1{margin:18px 0 0;font-size:28px;font-weight:600}
.status{color:var(--soft);font-size:15px;min-height:24px}
.wrap{position:relative;width:min(440px,94vw);aspect-ratio:4/5}
#stage{position:absolute;inset:0;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
#stage canvas{width:100%!important;height:100%!important;display:block}
.halo{position:absolute;left:50%;top:44%;width:92%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(94,231,255,.28),transparent 62%);transition:opacity .3s,filter .3s;opacity:.55}
body[data-mode=speaking] .halo{opacity:1;filter:brightness(1.3)}
body[data-mode=listening] .halo{background:radial-gradient(circle,rgba(255,211,110,.28),transparent 62%);opacity:.9}
.ring{position:absolute;left:50%;top:8%;width:70%;height:12%;transform:translateX(-50%);border:2px dashed rgba(94,231,255,.6);border-radius:50%;animation:pulse 3s ease-in-out infinite}
body[data-mode=listening] .ring{border-color:rgba(255,211,110,.8)}
@keyframes pulse{50%{opacity:.35;transform:translateX(-50%) scale(1.06)}}
button{font:600 18px 'Prompt',sans-serif;padding:14px 34px;border-radius:40px;border:1px solid var(--glow);background:rgba(94,231,255,.12);color:var(--ink);cursor:pointer;box-shadow:0 0 24px rgba(94,231,255,.3);min-height:48px;margin-top:6px}
button.on{border-color:#ff7a9a;background:rgba(255,122,154,.15);box-shadow:0 0 24px rgba(255,122,154,.3)}
.log{width:min(560px,92vw);margin:18px 0 12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:14px;font-size:15px;max-width:85%}
.msg.ai{background:rgba(94,231,255,.1);border:1px solid rgba(94,231,255,.25);align-self:flex-start}
.msg.user{background:rgba(255,255,255,.08);align-self:flex-end}
.credit{font-size:12px;color:#5f7290;margin:8px 0 20px}
.views{display:flex;gap:8px;margin:6px 0 2px}
.views button{font-size:14px;padding:6px 16px;min-height:36px;margin:0;box-shadow:none;background:transparent;border-color:rgba(94,231,255,.35)}
.views button.sel{background:rgba(94,231,255,.2);border-color:var(--glow)}
.think{position:absolute;right:14%;top:6%;display:flex;gap:6px;opacity:0;transition:opacity .3s}
.think i{width:10px;height:10px;border-radius:50%;background:#e6f6ff;animation:dot 1.2s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{transform:translateY(-6px);opacity:.4}}
body[data-mode=thinking] .think{opacity:1}
.holo{position:absolute;right:2%;top:18%;width:38%;height:30%;border:1px solid rgba(94,231,255,.7);border-radius:8px;background:linear-gradient(rgba(94,231,255,.12),rgba(94,231,255,.04));box-shadow:0 0 20px rgba(94,231,255,.4);opacity:0;transform:perspective(400px) rotateY(-25deg) scale(.9);transition:opacity .35s,transform .35s;overflow:hidden;pointer-events:none}
.holo::before{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(94,231,255,.45),transparent);animation:scan 1.4s linear infinite}
.holo span{position:absolute;left:8%;right:8%;height:4px;border-radius:2px;background:rgba(94,231,255,.55)}
@keyframes scan{from{top:-30%}to{top:100%}}
body[data-mode=analyzing] .holo{opacity:1;transform:perspective(400px) rotateY(-25deg) scale(1)}
.vbox{width:min(560px,92vw);margin-top:14px;border:1px solid rgba(94,231,255,.3);border-radius:14px;padding:10px 14px;background:rgba(94,231,255,.05)}
.vbox summary{cursor:pointer;font-weight:600;min-height:32px}
.vbox label{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}
.vbox input[type=range]{flex:1;accent-color:#5ee7ff}
.vbox select{flex:1;font:inherit;font-size:16px;padding:6px;border-radius:8px;background:#0e1630;color:#e6f6ff;border:1px solid rgba(94,231,255,.4)}
.vbox output{width:3em;text-align:right;color:var(--soft)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vbox button{font-size:14px;padding:6px 14px;min-height:36px;margin:0;box-shadow:none;background:transparent;border-color:rgba(94,231,255,.35)}
.vbox button.sel{background:rgba(94,231,255,.2);border-color:var(--glow)}
.vbox #vTest{margin-top:4px}
.tip{font-size:13px;color:var(--soft);margin:10px 0 2px}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<h1>ราฟาเอล</h1>
<div class="status" id="status">กำลังโหลดตัวละคร…</div>
<div class="wrap"><div class="halo"></div><div class="ring"></div><div id="stage"></div><div class="think"><i></i><i></i><i></i></div><div class="holo"><span style="top:18%;width:70%"></span><span style="top:32%;width:50%"></span><span style="top:46%;width:80%"></span><span style="top:60%;width:40%"></span><span style="top:74%;width:60%"></span></div></div>
<div class="views"><button data-view="full" class="sel">เต็มตัว</button><button data-view="half">ครึ่งตัว</button></div>
<button id="btn">เริ่มคุยกับราฟาเอล</button>
<details class="vbox"><summary>ตั้งค่าเสียงราฟาเอล</summary>
<div class="presets"><button data-preset="raphael">ราฟาเอล (นิ่ง)</button><button data-preset="soft">อ่อนโยน</button><button data-preset="bright">สดใส</button><button data-preset="machine">เครื่องจักร</button></div>
<label>เสียง <select id="vVoice"></select></label>
<label>ระดับเสียง <input id="vPitch" type="range" min="0.5" max="1.6" step="0.05"><output id="vPitchOut"></output></label>
<label>ความเร็ว <input id="vRate" type="range" min="0.6" max="1.4" step="0.05"><output id="vRateOut"></output></label>
<button id="vTest">ทดสอบเสียง</button>
<p class="tip">อยากได้เสียงที่ดีขึ้นบน iPhone: ตั้งค่า → การช่วยการเข้าถึง → เนื้อหาที่พูด → เสียง → ไทย → ดาวน์โหลด Kanya (ปรับปรุง/Enhanced) แล้วเลือกที่นี่</p>
</details>
<div class="log" id="log" aria-live="polite"></div>
<div class="credit">3D model: VRM sample by pixiv Inc. · AI: Pollinations</div>
<script src="app.bundle.js?v=1795784118"></script>
</body>
</html>
